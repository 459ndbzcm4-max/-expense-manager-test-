name: Browser test account hierarchy
on:
  push:
    branches:
      - fix/account-hierarchy-2026-10-20
    paths:
      - index.html
      - .github/workflows/test-account-hierarchy.yml
      - tests/account-hierarchy.spec.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check application JavaScript syntax
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const a=h.lastIndexOf('<script>')+8;const b=h.lastIndexOf('</script>');fs.writeFileSync('/tmp/app.js',h.slice(a,b));"
          node --check /tmp/app.js
      - name: Run browser tests
        run: node tests/account-hierarchy.spec.cjs
